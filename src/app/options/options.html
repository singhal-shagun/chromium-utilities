<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chromium utilities — Options</title>
    <link rel="stylesheet" href="options.css" />
    <script type="importmap">
      {
        "imports": {
          "ai": "https://esm.sh/ai@5",
          "@ai-sdk/openai-compatible": "https://esm.sh/@ai-sdk/openai-compatible@1"
        }
      }
    </script>
  </head>
  <body>
    <main class="page">
      <h1>Options</h1>
      <p class="hint">
        Configure the OpenAI-compatible chat-completions endpoint. The API key is stored locally on
        this device; the base URL and model are synced.
      </p>

      <form id="settings-form" class="form" novalidate>
        <label class="field">
          <span class="field__label">Base URL</span>
          <input
            id="baseUrl"
            name="baseUrl"
            type="url"
            autocomplete="off"
            spellcheck="false"
            placeholder="https://api.openai.com"
          />
          <span class="field__help"
            >The base URL of an OpenAI-compatible API. <code>/v1/chat/completions</code> is appended
            automatically.</span
          >
        </label>

        <label class="field">
          <span class="field__label">API key</span>
          <input id="apiKey" name="apiKey" type="password" autocomplete="off" spellcheck="false" />
          <span class="field__help">Stored in <code>chrome.storage.local</code>.</span>
        </label>

        <label class="field">
          <span class="field__label">Model</span>
          <input
            id="model"
            name="model"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="gpt-4o-mini"
          />
        </label>

        <div class="actions">
          <button id="save-btn" type="submit" class="btn btn--primary">Save</button>
          <button id="test-btn" type="button" class="btn">Test connection</button>
        </div>

        <div id="status" class="status" role="status" aria-live="polite"></div>
      </form>

      <p class="cors">
        Note: cross-origin <code>fetch</code> from this extension requires the endpoint to return
        permissive CORS headers.
      </p>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
