<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Chromium Utilities</title>
        <link rel="stylesheet" href="sidepanel.css" />
    </head>
    <body>
        <main class="shell">
            <!-- Tab Headers -->
            <nav class="tabs-header" aria-label="Feature tabs">
                <button id="tab-html-markdown" class="tab-button active" type="button">HTML → MD</button>
                <button id="tab-watchlist-import" class="tab-button" type="button">Watchlist Import</button>
            </nav>

            <!-- Tab 1: HTML → Markdown Panel -->
            <div id="panel-html-markdown" class="tab-panel active">
                <header class="header">
                    <h1>HTML → Markdown</h1>
                    <p>
                        Pick elements, validate them, and convert them to Markdown.
                    </p>
                </header>

                <!-- Filename -->
                <section class="field-group">
                    <label for="filename">Filename</label>
                    <input
                        id="filename"
                        name="filename"
                        type="text"
                        placeholder="page.md" />
                </section>

                <!-- Selector rows -->
                <section
                    id="rows"
                    class="rows"
                    aria-label="Selector rows"></section>

                <!-- Toolbar -->
                <section class="toolbar">
                    <button id="add-row-btn" type="button">Add selector</button>
                    <button id="convert-btn" type="button" class="primary">
                        Convert
                    </button>
                </section>

                <!-- Step-by-step feedback indicators -->
                <section id="steps" class="steps" aria-label="Conversion progress">
                    <div class="step" data-step="connection">
                        <span class="step-icon">○</span>
                        <span class="step-label">Connection</span>
                        <span class="step-status"></span>
                    </div>
                    <div class="step" data-step="extraction">
                        <span class="step-icon">○</span>
                        <span class="step-label">Extraction</span>
                        <span class="step-status"></span>
                    </div>
                    <div class="step" data-step="upload">
                        <span class="step-icon">○</span>
                        <span class="step-label">Upload &amp; Download</span>
                        <span class="step-status"></span>
                    </div>
                </section>

                <!-- Status messages -->
                <section id="status" class="status" aria-live="polite"></section>
            </div>

            <!-- Tab 2: Watchlist Import Panel -->
            <div id="panel-watchlist-import" class="tab-panel">
                <header class="header">
                    <h1>Watchlist Import</h1>
                    <p>
                        Import stock symbols from Screener.in results directly
                        to your watchlist.
                    </p>
                </header>

                <section class="watchlist-section">
                    <div class="watchlist-controls">
                        <div class="radio-group">
                            <label>
                                <input
                                    type="radio"
                                    name="watchlist-action"
                                    value="append"
                                    checked />
                                Append to Watchlist
                            </label>
                            <label>
                                <input
                                    type="radio"
                                    name="watchlist-action"
                                    value="overwrite" />
                                Overwrite Watchlist
                            </label>
                        </div>

                        <button
                            id="import-watchlist-btn"
                            type="button"
                            class="primary">
                            Import into Watchlist
                        </button>

                        <!-- Collapsible Settings -->
                        <details class="watchlist-settings">
                            <summary>Settings</summary>
                            <div class="field-item">
                                <label for="watchlist-endpoint"
                                    >Relative Endpoint</label
                                >
                                <input
                                    id="watchlist-endpoint"
                                    type="text"
                                    value="/api/portfolio-watchlist/import-from-screener" />
                            </div>
                        </details>
                    </div>
                    <div
                        id="watchlist-status"
                        class="watchlist-status"
                        aria-live="polite"></div>
                    <div id="import-results-container" class="import-results-container"></div>
                </section>
            </div>
        </main>

        <script src="../../core/slug.js"></script>
        <script src="../../core/filename.js"></script>
        <script src="../../core/storage.js"></script>
        <script src="sidepanel.js"></script>
    </body>
</html>
