<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML → Markdown</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <h1>HTML → Markdown</h1>
        <p>Pick elements, validate them, and convert them to Markdown.</p>
      </header>

      <section class="field-group">
        <label for="filename">Filename</label>
        <input id="filename" name="filename" type="text" placeholder="page.md" />
      </section>

      <section class="toolbar">
        <button id="add-row-btn" type="button">Add selector</button>
        <button id="convert-btn" type="button">Convert</button>
      </section>

      <section id="rows" class="rows" aria-label="Selector rows"></section>

      <section id="status" class="status" aria-live="polite"></section>

      <section class="output-area">
        <label for="markdown-output">Markdown preview</label>
        <textarea id="markdown-output" rows="10" readonly></textarea>
        <div class="output-actions">
          <button id="copy-btn" type="button">Copy</button>
        </div>
      </section>
    </main>

    <script src="../../core/slug.js"></script>
    <script src="../../core/storage.js"></script>
    <script src="markdown.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
